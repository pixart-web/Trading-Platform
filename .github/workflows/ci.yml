name: Quality and integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocket_alpha
          POSTGRES_PASSWORD: local_only
          POSTGRES_DB: pocket_alpha
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pocket_alpha"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PA_ENVIRONMENT: test
      PA_LIVE_TRADING_ENABLED: "false"
      PA_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: pytest --cov=pocket_alpha --cov-report=term-missing
      - run: docker compose config
      - run: docker build -t pocket-alpha:ci .
