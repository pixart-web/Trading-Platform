name: Quality and integration

on:
  push:
  pull_request:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocket_alpha
          POSTGRES_PASSWORD: local_only
          POSTGRES_DB: pocket_alpha
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pocket_alpha"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PA_ENVIRONMENT: test
      PA_LIVE_TRADING_ENABLED: "false"
      PA_DERIVATIVE_EXECUTION_ENABLED: "false"
      PA_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.lock && pip install --no-deps -e .
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy .
      - run: python -m pocket_alpha.mobile.export_schema --check
      - run: python android/tooling/audit_local_engines.py --check
      - run: python -m tests.local_kernel_vectors --check
      - run: python -m tests.local_strategy_vectors --check
      - name: Verify one Alembic head
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: Full suite with PostgreSQL and Redis
        run: pytest --cov=pocket_alpha --cov-branch --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: npm install --global pnpm@11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pip-audit==2.10.1 bandit==1.9.4 detect-secrets==1.5.0
      - run: pip-audit --requirement requirements-runtime.lock --progress-spinner off
      - run: pip-audit --requirement requirements.lock --progress-spinner off
      - run: bandit -r src -ll -q
      - name: Reject new candidate secrets
        run: detect-secrets-hook --baseline .secrets.baseline --exclude-lines '^\s*<sha256 value="[0-9a-f]{64}" origin="Generated by Gradle"/>\s*$' --exclude-files 'pnpm-lock\.yaml$' $(git ls-files)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.19.0
      - working-directory: frontend
        run: pnpm audit --prod --audit-level high

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare live-control CI secret
        run: | # pragma: allowlist secret -- deterministic CI-only fixture
          mkdir -p /tmp/pocket-alpha-secrets
          printf '%s' 'ci-only-control-token-ci-only-control-token' > /tmp/pocket-alpha-secrets/control_proxy_token
          echo "PA_CONTROL_PROXY_TOKEN_SECRET_FILE=/tmp/pocket-alpha-secrets/control_proxy_token" >> "$GITHUB_ENV"
      - name: Validate development and production Compose
        run: | # pragma: allowlist secret -- deterministic CI-only database/PIN/session fixtures
          mkdir -p /tmp/pocket-alpha-secrets
          printf '%s' 'local-ci-only' > /tmp/pocket-alpha-secrets/postgres_password
          printf '%s' 'local-ci-only' > /tmp/pocket-alpha-secrets/redis_password
          printf '%s' 'postgresql+psycopg://pocket_alpha:local-ci-only@db:5432/pocket_alpha' > /tmp/pocket-alpha-secrets/database_url
          printf '%s' 'redis://:local-ci-only@redis:6379/0' > /tmp/pocket-alpha-secrets/redis_url
          chmod 700 /tmp/pocket-alpha-secrets
          chmod 444 /tmp/pocket-alpha-secrets/*
          echo "PA_DOMAIN=research.example.test" >> "$GITHUB_ENV"
          echo "PA_ADMIN_USER=operator" >> "$GITHUB_ENV"
          echo "PA_ADMIN_PASSWORD_HASH=ci-validation-hash" >> "$GITHUB_ENV"
          echo "PA_DATABASE_URL_SECRET_FILE=/tmp/pocket-alpha-secrets/database_url" >> "$GITHUB_ENV"
          echo "PA_REDIS_URL_SECRET_FILE=/tmp/pocket-alpha-secrets/redis_url" >> "$GITHUB_ENV"
          echo "PA_POSTGRES_PASSWORD_SECRET_FILE=/tmp/pocket-alpha-secrets/postgres_password" >> "$GITHUB_ENV"
          echo "PA_REDIS_PASSWORD_SECRET_FILE=/tmp/pocket-alpha-secrets/redis_password" >> "$GITHUB_ENV"
          printf '%s' '908172' | sha256sum | cut -d ' ' -f1 > /tmp/pocket-alpha-secrets/operator_pin_hash
          printf '%s' 'ci-only-session-secret-ci-only-session-secret-ci-only-session-secret' > /tmp/pocket-alpha-secrets/session_secret
          echo "PA_OPERATOR_PIN_HASH_SECRET_FILE=/tmp/pocket-alpha-secrets/operator_pin_hash" >> "$GITHUB_ENV"
          echo "PA_SESSION_SECRET_FILE=/tmp/pocket-alpha-secrets/session_secret" >> "$GITHUB_ENV"
          docker compose config --quiet
      - name: Validate production exposure boundary
        run: |
          docker compose -f compose.native.yaml config --quiet
          test "$(docker compose -f compose.native.yaml config --format json | jq '[.services | keys[] | select(. == "web")] | length')" -eq 0
          docker compose -f compose.production.yaml config --quiet
          test "$(docker compose -f compose.production.yaml config --format json | jq '[.services[] | select(.ports != null)] | length')" -eq 1
          test "$(docker compose -f compose.production.yaml config --format json | jq -r '.services.proxy.ports[0].published')" = "80"
      - name: Build production images
        run: |
          docker compose build api web
          docker compose -f compose.production.yaml build api web migrate
      - name: Scan runtime images
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image --exit-code 1 --ignore-unfixed --severity CRITICAL pocket-alpha-api:latest
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0 image --exit-code 1 --ignore-unfixed --severity CRITICAL pocket-alpha-web:latest
      - name: Start disposable stack and smoke boundaries
        run: |
          docker compose up --detach --wait --wait-timeout 240
          curl --fail --silent --show-error http://127.0.0.1:8000/health/ready | jq -e '.status == "ready"'
          curl --fail --silent --show-error --head http://127.0.0.1:3000/ | grep -i '^x-content-type-options: nosniff'
          docker compose exec -T api python -c "from pocket_alpha.config import Settings; s=Settings(); assert s.live_trading_enabled is False and s.derivative_execution_enabled is False"
      - name: Verify disposable PostgreSQL backup and restore
        run: |
          docker compose exec -T db pg_dump -U pocket_alpha --format=custom pocket_alpha > /tmp/pocket-alpha.dump
          test -s /tmp/pocket-alpha.dump
          docker compose exec -T db createdb -U pocket_alpha pocket_alpha_restore
          docker compose exec -T db pg_restore -U pocket_alpha --exit-on-error --dbname=pocket_alpha_restore < /tmp/pocket-alpha.dump
          test "$(docker compose exec -T db psql -U pocket_alpha -d pocket_alpha_restore -tAc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public'")" -gt 0
          docker compose exec -T db dropdb -U pocket_alpha pocket_alpha_restore
      - name: Stop development stack before production-boundary smoke
        run: docker compose down --volumes --remove-orphans
      - name: Start production topology and verify authentication
        run: |
          export PA_DOMAIN=http://localhost
          export PA_ADMIN_PASSWORD_HASH="$(docker run --rm caddy:2.11.4-alpine caddy hash-password --plaintext ci-only-password)"
          docker compose -f compose.production.yaml up --detach --wait --wait-timeout 240
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/)" = "307"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' --header 'Content-Type: application/json' --data '{"user":"operator","pin":"incorrect"}' http://localhost/api/auth/login)" = "401"
          curl --fail --silent --show-error --cookie-jar /tmp/pocket-alpha-ci-session --header 'Content-Type: application/json' --data '{"user":"operator","pin":"908172"}' http://localhost/api/auth/login > /dev/null
          test "$(curl --silent --cookie /tmp/pocket-alpha-ci-session --output /dev/null --write-out '%{http_code}' http://localhost/)" = "200"
      - name: Verify backend-only native topology
        run: | # pragma: allowlist secret -- disposable native CI operator
          export PA_DOMAIN=http://localhost
          docker compose -f compose.production.yaml down --volumes --remove-orphans
          docker compose -f compose.native.yaml up --detach --wait --wait-timeout 240
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/mobile/api/v1/status)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/api/v1/assets)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost/health/ready)" = "404"
          docker compose -f compose.native.yaml exec -T api python - <<'PYCODE'
          from uuid import uuid4
          from sqlalchemy.orm import Session
          from pocket_alpha.config import Settings
          from pocket_alpha.database import build_engine
          from pocket_alpha.mobile.models import OperatorRecord
          from pocket_alpha.mobile.security import password_hash
          with Session(build_engine(Settings())) as db, db.begin():
              db.add(OperatorRecord(user_id=uuid4(), workspace="operator", username="native-ci", password_hash=password_hash("disposable-native-ci-password"), disabled=False))
          PYCODE
          curl --fail --silent --show-error --header 'Content-Type: application/json' --data '{"username":"native-ci","password":"disposable-native-ci-password","device_name":"CI native smoke"}' http://localhost/mobile/api/v1/auth/login > /tmp/pocket-alpha-native-ci-credentials
          native_access="$(jq -r .access_token /tmp/pocket-alpha-native-ci-credentials)"
          curl --fail --silent --show-error --header "Authorization: Bearer $native_access" http://localhost/mobile/api/v1/status | jq -e '.status == "authenticated"'
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs --no-color
          docker compose -f compose.production.yaml logs --no-color
          docker compose -f compose.native.yaml logs --no-color
      - name: Stop disposable stacks
        if: always()
        run: |
          docker compose down --volumes --remove-orphans
          docker compose -f compose.production.yaml down --volumes --remove-orphans
          docker compose -f compose.native.yaml down --volumes --remove-orphans

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Validate official Gradle Wrapper
        run: echo "2db75c40782f5e8ba1fc278a5574bab070adccb2d21ca5a6e5ed840888448046  gradle/wrapper/gradle-wrapper.jar" | sha256sum --check
      - name: Install pinned Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Compile, test, lint and build unsigned release artifacts
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:assembleDebugAndroidTest :app:writeRuntimeCoordinates
      - name: Audit resolved runtime dependencies
        run: python3 tooling/audit_dependencies.py app/build/reports/runtime-coordinates.tsv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: android-build-and-test-evidence
          path: |
            android/app/build/outputs/apk/
            android/app/build/outputs/bundle/
            android/app/build/reports/
            android/app/build/test-results/
          retention-days: 14

  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocket_alpha
          POSTGRES_PASSWORD: local_only # pragma: allowlist secret -- disposable CI service
          POSTGRES_DB: pocket_alpha_native_e2e
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U pocket_alpha -d pocket_alpha_native_e2e"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PA_ENVIRONMENT: test
      PA_INTEGRATION: "1"
      PA_MOBILE_API_ENABLED: "true"
      PA_DATABASE_URL: postgresql+psycopg://pocket_alpha:local_only@localhost:5432/pocket_alpha_native_e2e # pragma: allowlist secret -- disposable CI service
      PA_REDIS_URL: redis://localhost:6379/0
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Start disposable native HTTPS backend
        working-directory: .
        run: |
          pip install -r requirements-runtime.lock
          pip install --no-deps -e .
          python -m tests.native_e2e_seed
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout "$RUNNER_TEMP/native-e2e-key.pem" -out "$RUNNER_TEMP/native-e2e-ca.pem" -subj '/CN=Pocket Alpha Disposable E2E' -addext 'subjectAltName=DNS:localhost'
          chmod 600 "$RUNNER_TEMP/native-e2e-key.pem"
          uvicorn pocket_alpha.main:app --host 127.0.0.1 --port 18443 --ssl-keyfile "$RUNNER_TEMP/native-e2e-key.pem" --ssl-certfile "$RUNNER_TEMP/native-e2e-ca.pem" --no-access-log > "$RUNNER_TEMP/native-e2e-api.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --cacert "$RUNNER_TEMP/native-e2e-ca.pem" https://localhost:18443/health/ready > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable hardware virtualization for disposable emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          working-directory: android
          script: | # pragma: allowlist secret -- synthetic fixture credentials only
            adb reverse tcp:18443 tcp:18443
            ./gradlew --no-daemon -Pe2eCaFile="$RUNNER_TEMP/native-e2e-ca.pem" :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p app/build/reports/androidTests
            adb shell am instrument -w -r -e class pt.pocketalpha.BackendWorkflowTest,pt.pocketalpha.NativeUiTest,pt.pocketalpha.PublicWorkspaceAndroidTest -e origin https://localhost:18443 -e username android-e2e -e password disposable-android-e2e-password -e screenshotName ci pt.pocketalpha.android.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/reports/androidTests/instrumentation.txt
            grep -F 'OK (3 tests)' app/build/reports/androidTests/instrumentation.txt
            adb pull /sdcard/Android/data/pt.pocketalpha.android/files/screenshots/ci-dashboard.png app/build/reports/androidTests/ci-dashboard.png
            adb pull /sdcard/Android/data/pt.pocketalpha.android/files/screenshots/ci-overview.png app/build/reports/androidTests/ci-overview.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-device-evidence
          path: android/app/build/reports/androidTests/
          retention-days: 14

  android-local-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_7
          working-directory: android
          script: |
            ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p app/build/reports/local-engine
            adb shell am instrument -w -r -e class pt.pocketalpha.LocalStandaloneEngineTest,pt.pocketalpha.PortableLedgerAndroidTest -e localPhase create pt.pocketalpha.android.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/reports/local-engine/create.txt
            grep -F 'OK (2 tests)' app/build/reports/local-engine/create.txt
            adb shell am force-stop pt.pocketalpha.android
            adb shell am instrument -w -r -e class pt.pocketalpha.LocalStandaloneEngineTest -e localPhase recover pt.pocketalpha.android.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/reports/local-engine/recover.txt
            grep -F 'OK (1 test)' app/build/reports/local-engine/recover.txt
            adb logcat -d -s LocalEngineProof:I > app/build/reports/local-engine/native-runtime.txt
            adb shell am instrument -w -r -e class pt.pocketalpha.KeyLossAndroidTest pt.pocketalpha.android.test/androidx.test.runner.AndroidJUnitRunner | tee app/build/reports/local-engine/key-loss.txt
            grep -F 'OK (1 test)' app/build/reports/local-engine/key-loss.txt
            ./gradlew -p runtime-proof --no-daemon -PprobeStdlibOnly=true :probe:assembleDebug
            adb install -r runtime-proof/probe/build/outputs/apk/debug/probe-debug.apk
            adb logcat -c
            adb shell am start -W -n pt.pocketalpha.runtimeproof/.ProbeActivity
            adb logcat -d -s PocketRuntimeProof:I > app/build/reports/local-engine/python-runtime.txt
            grep -F '3.12.' app/build/reports/local-engine/python-runtime.txt
            grep -F 'x86_64' app/build/reports/local-engine/python-runtime.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: standalone-engine-x86-evidence
          path: android/app/build/reports/local-engine/
