[versions]
agp = "8.9.2"
kotlin = "2.1.20"
compose = "2025.04.01"
hilt = "2.56.2"
room = "2.7.1"
[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
