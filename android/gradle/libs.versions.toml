activity = { module = "androidx.activity:activity-compose", version = "1.10.1" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.9.0" }
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.9.0" }
navigation = { module = "androidx.navigation:navigation-compose", version = "2.9.0" }
hilt = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
