services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pocket_alpha
      POSTGRES_PASSWORD: local_only
      POSTGRES_DB: pocket_alpha
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket_alpha"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      PA_DATABASE_URL: postgresql+psycopg://pocket_alpha:local_only@db:5432/pocket_alpha
    depends_on:
      db: {condition: service_healthy}
  api:
    build: .
    ports: ["127.0.0.1:8000:8000"]
    environment:
      PA_DATABASE_URL: postgresql+psycopg://pocket_alpha:local_only@db:5432/pocket_alpha
      PA_REDIS_URL: redis://redis:6379/0
      PA_LIVE_TRADING_ENABLED: "false"
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
volumes:
  postgres_data:
