name: pocket-alpha-native
services:
  proxy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      PA_DOMAIN: ${PA_DOMAIN:?set PA_DOMAIN}
    volumes:
      - ./deploy/Caddyfile.native:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, application]
    depends_on:
      api: {condition: service_healthy}
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  api:
    image: pocket-alpha-api:latest
    build: .
    restart: unless-stopped
    environment:
      PA_ENVIRONMENT: production
      PA_MOBILE_API_ENABLED: "true"
      PA_DATABASE_URL_FILE: /run/secrets/database_url
      PA_REDIS_URL_FILE: /run/secrets/redis_url
      PA_CONTROL_PROXY_TOKEN_FILE: /run/secrets/control_proxy_token
      PA_LIVE_TRADING_ENABLED: "${PA_LIVE_TRADING_ENABLED:-false}"
      PA_DERIVATIVE_EXECUTION_ENABLED: "${PA_DERIVATIVE_EXECUTION_ENABLED:-false}"
    secrets: [database_url, redis_url, control_proxy_token]
    networks: [application, data, providers]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  migrate:
    image: pocket-alpha-api:latest
    build: .
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment:
      PA_ENVIRONMENT: production
      PA_DATABASE_URL_FILE: /run/secrets/database_url
      PA_REDIS_URL_FILE: /run/secrets/redis_url
      PA_CONTROL_PROXY_TOKEN_FILE: /run/secrets/control_proxy_token
      PA_LIVE_TRADING_ENABLED: "${PA_LIVE_TRADING_ENABLED:-false}"
      PA_DERIVATIVE_EXECUTION_ENABLED: "${PA_DERIVATIVE_EXECUTION_ENABLED:-false}"
    secrets: [database_url, redis_url, control_proxy_token]
    networks: [data]
    depends_on:
      db: {condition: service_healthy}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pocket_alpha
      POSTGRES_DB: pocket_alpha
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocket_alpha -d pocket_alpha"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - sh
      - -ec
      - exec redis-server --save "" --appendonly no --requirepass "$$(cat /run/secrets/redis_password)"
    secrets: [redis_password]
    networks: [data]
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$$(cat /run/secrets/redis_password)" ping
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]

networks:
  providers: {}
  edge: {}
  application:
    internal: true
  data:
    internal: true

secrets:
  database_url:
    file: ${PA_DATABASE_URL_SECRET_FILE:?set PA_DATABASE_URL_SECRET_FILE}
  redis_url:
    file: ${PA_REDIS_URL_SECRET_FILE:?set PA_REDIS_URL_SECRET_FILE}
  postgres_password:
    file: ${PA_POSTGRES_PASSWORD_SECRET_FILE:?set PA_POSTGRES_PASSWORD_SECRET_FILE}
  redis_password:
    file: ${PA_REDIS_PASSWORD_SECRET_FILE:?set PA_REDIS_PASSWORD_SECRET_FILE}
  control_proxy_token:
    file: ${PA_CONTROL_PROXY_TOKEN_SECRET_FILE:?set PA_CONTROL_PROXY_TOKEN_SECRET_FILE}

volumes:
  postgres_data: {}
  caddy_data: {}
  caddy_config: {}
